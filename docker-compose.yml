# Chạy: cp .env.example .env  (điền giá trị) → docker compose up -d --build
# Không đặt secret trực tiếp trong file này.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: evcs, POSTGRES_PASSWORD: evcs, POSTGRES_DB: evcs }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U evcs"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  api:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://evcs:evcs@postgres:5432/evcs
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTOR: celery
      ARTIFACTS_DIR: /data/artifacts
      MEDIA_LIBRARY_DIR: /data/media_library
    volumes: [artifacts:/data, ./secrets:/app/secrets:ro]
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    # worker pipeline + VieNeu (CPU). Tách máy GPU: chạy image này trên máy có GPU, trỏ cùng Postgres/Redis/volume.
    build: { context: ., dockerfile: Dockerfile.tts }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://evcs:evcs@postgres:5432/evcs
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTOR: celery
      ARTIFACTS_DIR: /data/artifacts
      MEDIA_LIBRARY_DIR: /data/media_library
      TTS_PROVIDER: vieneu_local
      VIENEU_BACKEND: onnx
    volumes: [artifacts:/data, hfcache:/root/.cache/huggingface, ./secrets:/app/secrets:ro]
    depends_on: [api, redis]
  web:
    build: { context: ., dockerfile: Dockerfile.frontend, args: { NEXT_PUBLIC_API_BASE: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, artifacts: {}, hfcache: {} }
