[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-studio"
version = "1.0.0"
description = "EV Creator Studio — tòa soạn video AI có người duyệt cuối (YouTube PRIVATE)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30", "alembic>=1.13", "psycopg[binary]>=3.1", "httpx>=0.27", "feedparser>=6.0",
  "anthropic>=0.40", "google-api-python-client>=2.130", "google-auth-oauthlib>=1.2", "google-auth>=2.30",
  "apscheduler>=3.10,<4", "celery>=5.4", "redis>=5.0", "cryptography>=42", "pillow>=10.3", "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tts = ["vieneu==3.8.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["ev_studio*"]

[tool.setuptools.package-data]
ev_studio = ["assets/fonts/*", "web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
